name: Go

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: pkg/scraping/go.mod
        cache-dependency-path: pkg/scraping/go.sum
    - name: Get dependencies
      working-directory: pkg/scraping/
      run: go get -v -t -d ./...
    - name: Build
      working-directory: pkg/scraping/
      run: go build -v ./...
    - name: Test
      working-directory: pkg/scraping/
      run: go test -v -cover ./...
